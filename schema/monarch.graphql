"""
One span of insight copy, with optional entity annotation.

Mirrors `PromptSegmentType` from smart prompts, which already ships a renderer on web and
mobile — plus `entityId`, which smart prompts do not carry because their subject is
denormalized onto the row. We need the id inline so a client can deep-link a segment that is
not the insight's own subject, and so it can re-resolve a renamed entity at render time.

Stored keys are snake_case; graphene camelizes them here.

🔴 `entityType: "amount"` is not a neutral hint — the shipped `formatSegmentText` does
`parseFloat(text)` then formats as currency, so a percentage tagged `amount` renders as
dollars. Percentages use `percent`.
