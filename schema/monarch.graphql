- Resets updated_by_retail_sync_at so the transaction can be re-matched
- Removes the receipt attachment copy from the transaction (best-effort)
- Unlinks the retail transaction from the Monarch transaction
- Recalculates the retail sync status (back to PENDING_MATCHES if applicable)
