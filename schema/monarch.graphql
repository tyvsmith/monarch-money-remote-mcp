"""
One row of the recurring list: a group as it reads inside the requested window.

The window-varying cells (amount, account, category, status, date) live here rather than on
`recurrenceGroup`, so a group keeps a single identity no matter how many months are loaded —
March's account and the group's own account are different fields, not the same field fetched
twice. Without a window (the All view) they fall back to the group's today-relative values.

A sub-monthly group has more than one payment in a month, which those single cells cannot
express: they describe the one payment the row **promotes**, and `occurrences` carries the rest
for the client to expand.

Resolver `parent` is a `RecurrenceGroupItem`.
"""
type RecurrenceGroupForPeriod {
  """
  The account that paid this window, else the most recent charge before it. Singular even when the window has several occurrences. Without a window, the latest assigned transaction's account.
  """
  account: Account

  """
  Signed amount for the whole window — the sum of `occurrences`, so a semi-monthly paycheck reads as the pair rather than as one half. Unpaid occurrences contribute a guess from the most recent charge dated before each of them. Without a window, the latest assigned transaction's amount.
  """
  amount: Float

  """
  The category of the charge that paid this window, else the most recent charge before it. Off the same charge as `account`. Without a window, the latest assigned transaction's.
  """
  category: Category

  """
  The single date to show for the group within the window — the promoted occurrence's, so the actual charge date when it has posted and the expected date otherwise. Null on the All view.
  """
  date: Date

  """End of the requested window; null on the All view."""
  endDate: Date
  id: ID!

  """
  Every payment the window is responsible for, ascending — what the row expands to reveal. One entry per expected occurrence, plus any in-window charge that paid none of them (off-schedule or duplicate activity). A monthly group has exactly one; a semi-monthly / biweekly / weekly group has several. The collapsed cells above speak for the one that is promoted: the earliest unpaid, else the latest paid. Empty on the All view.
  """
  occurrences: [RecurrenceGroupOccurrence!]!

  """The group itself, with its whole-group values."""
  recurrenceGroup: RecurrenceGroup!

  """
  income / expense / transfer for this window, off the same charge as `amount`, so it always agrees with `category` beside it. An uncategorized charge has no category type to read, so its amount sign decides. Without a window, the latest assigned transaction's.
  """
  recurringType: RecurringType

  """Start of the requested window; null on the All view."""
  startDate: Date

  """
  Month-scoped status (paid / upcoming / overdue / ended) for the window, off the promoted occurrence. Reports ONLY occurrences inside the window: a missed charge stays overdue in its own month and never carries into the next one, so the month containing today reads upcoming for its own not-yet-due charge even while an earlier cycle is unpaid. Does not surface possibly_inactive (a today-relative nudge). Without a window this is the group's own `status`.
  """
  status: RecurrenceGroupStatus!
}

"""
One expected recurrence occurrence with its paid status and attributed charges.
"""
type RecurrenceGroupHistoryInterval {
  amount: Float
  date: Date!
  isPaid: Boolean!
  transactions: [Transaction!]!
}

"""
Eligibility result for merging a single candidate group with the current selection.
"""
type RecurrenceGroupMergeEligibility {
  """The eligibility outcome for this candidate."""
  eligibility: RecurrenceGroupMergeEligibilityFields!

  """The candidate group being evaluated."""
  recurrenceGroup: RecurrenceGroup!
}

"""
Eligibility outcome for a single merge candidate — without the candidate group itself.
"""
type RecurrenceGroupMergeEligibilityFields {
  """True if this candidate can be merged with the current selection."""
  isEligible: Boolean!

  """
  True if the candidate's date range does not overlap the base (it ended before the base started).
  """
  isSequential: Boolean

  """
  True if the candidate fits but the frequency match is weaker than ideal.
  """
  isWeakFit: Boolean

  """Reason this candidate cannot be merged, if ineligible."""
  mergeIneligibilityReason: MergeIneligibleReason

  """
  The frequency the merged group would have if this candidate were included.
  """
  mergedGroupFrequency: String

  """
  Amount of the most recent transaction across all groups in the theoretical merge.
  """
  mergedLatestAmount: Float
}

input RecurrenceGroupMergeEligibilityInput {
  """
  Groups already committed to the merge; included when scoring each new candidate.
  """
  alreadyMergedGroupIds: [ID!]

  """The group to treat as the merge target."""
  baseGroupId: ID!

  """Candidate groups to evaluate for eligibility."""
  possibleGroupIdsToMerge: [ID!]
}

"""
One payment a window is responsible for — what a month cell expands to reveal.

A monthly group has exactly one; a semi-monthly / biweekly / weekly group has several, and its
collapsed cell speaks for just one of them (the earliest unpaid, else the latest paid).

Resolver `parent` is a `PeriodOccurrence`.
"""
type RecurrenceGroupOccurrence {
  """Off the same charge as `amount`."""
  account: Account

  """
  Signed amount. The actual charge once paid; while unpaid, a guess from the most recent charge dated before THIS occurrence — so the second half of a semi-monthly month guesses from the first half rather than from last month.
  """
  amount: Float!

  """Off the same charge as `amount`."""
  category: Category

  """
  The charge's actual date once paid — which can sit a few days off the expected one — else the expected date.
  """
  date: Date!

  """Whether a charge has posted for this occurrence."""
  isPaid: Boolean!

  """
  paid / overdue / upcoming for this one payment. Never ended or possibly_inactive, which describe the whole group.
  """
  status: RecurrenceGroupStatus!

  """The charge that paid it; null while unpaid."""
  transaction: Transaction
}

