type SavingsGoal {
  allocationAmountsByAccount: [GoalAccountCurrentContributionAmounts]
  archivedAt: DateTime

  """
  The balance of this goal for the current month. Sums the goal events for the current month only.
  """
  balanceThisMonth: Float!
  completedAt: DateTime
  contributionTotal: Float!
  createdAt: DateTime!
  currentBalance: Float!

  """The actual budget amount for the current month."""
  currentMonthActualBudgetAmount: Float!

  """
  The planned contribution amount for the current month. We use this field for when editing goals when there are no differences between the current and planned contribution amounts.
  """
  currentMonthPlannedContributionAmount: Float!
  estimatedMonthsUntilCompletion: Int
  forecastedCompletionDate: Date

  """
  Fetch a single goal event by ID. Returns null if the event does not belong to this goal.
  """
  goalEvent(id: ID!): GoalEvent

  """
  Returns the goal events aggregated by period. Intended for use in the goal event timeline. Will return at most 1000 data points.
  """
  goalEventAggregation(
    """
    The end date to aggregate goal events for. If not provided, then the end date is derived from the forecasted completion date or target date of the goal.
    """
    endDate: Date

    """
    If true, only include goal events that are after the v3 migration date.
    """
    excludeEventsBeforeV3Migration: Boolean

    """If true, only include goal events that are included in the budget."""
    excludeEventsNotInBudget: Boolean

    """
    If true, all events dated after today are collapsed into a single bucket whose date is today + 1 day. Defaults to true.
    """
    groupEventsAfterToday: Boolean

    """
    The type of grouping to use for the timeline data. If not provided, the grouping is derived from the forecasted completion date or target date of the goal.
    """
    groupingPeriod: GoalEventAggregationGroupingPeriodType

    """
    The start date to aggregate goal events for. If not provided, the start date is derived from the earliest goal event date.
    """
    startDate: Date

    """
    The date to aggregate goal events for. If not provided, then the current date is used.
    """
    today: Date
  ): GoalEventAggregation!
  goalEvents: [GoalEvent] @deprecated(reason: "Use goalEventsPaginated instead.")
  goalEventsPaginated(
    """The end date to filter events by. Defaults to None."""
    endDate: Date

    """
    The maximum number of events to return. Defaults to 100. Is capped at 500.
    """
    limit: Int

    """The offset to start from. Defaults to 0."""
    offset: Int

    """The start date to filter events by. Defaults to None."""
