  undoHouseholdSavingsGoalsMigration: UndoHouseholdSavingsGoalsMigration

  """
  Put a dismissed card back in the feed, and drop the mute the dismissal added.
  
  Separate from `updateInsightStatus` rather than a `NEW` transition through it: a permanent
  denial is terminal there, which is the guard that stops a sweep, a retirement pass, or a
  second writer resurrecting a card. A member undoing it is the one intent that outranks the
  guard, so it gets its own entry point.
  
  Household-wide, like every other insight write: any member can undo any member's dismissal,
  the same shared-state rule `setInsightFeedback` and `updateInsightStatus` follow.
  
  Leaves `feedback` alone. Taking back the dismissal and taking back the thumbs-down are two
  verdicts, and the caller decides whether to send both.
