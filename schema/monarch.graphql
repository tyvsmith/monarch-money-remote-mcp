"""
A V2 recurring group. Most fields are derived on read from the group's assigned transactions
(latest-anchored); only `frequency` and the user overrides live on the group itself.

Resolver `parent` is a `RecurrenceGroupItem` (group + derived fields).
"""
type RecurrenceGroup {
  """
  The latest assigned transaction's account. For the account that paid a specific month, read account off recurrenceGroupsForPeriod instead.
  """
  account: Account

  """
  Signed amount of the latest assigned transaction. For a specific month's charge, read amount off recurrenceGroupsForPeriod instead.
  """
  amount: Float

  """
  The latest assigned transaction's category. For the category of a specific month's charge, read category off recurrenceGroupsForPeriod instead.
  """
  category: Category

  """
  When the group row was first persisted. For detected groups this is the original detection write; re-runs skip an existing detection_group_id, so the timestamp does not move. The New-badge hover renders it as 'Detected {date}'.
  """
  createdAt: DateTime!

  """
  When the user marked the group ended; null while active. Always user-initiated.
  """
  endedAt: DateTime

  """The recurrence cadence (e.g. monthly, weekly). Stored on the group."""
  frequency: String!

  """
  One entry per expected occurrence, oldest first. `isPaid` uses the same slot matching and grace as `status` / `periodStatus`; a group younger than `count` cycles returns fewer entries. `amount` is netted, so a refunded cycle can read 0.
  """
  historyIntervals(
    """How many trailing intervals to return, clamped to 24."""
    count: Int = 12
  ): [RecurrenceGroupHistoryInterval!]!
  id: ID!

  """False once the user has ended the group (`ended_at` set)."""
  isActive: Boolean!

  """
  True when the assigned transactions' amounts vary (a variable-amount stream); False for a fixed amount.
  """
  isApproximate: Boolean!

  """
  Whether to show the 'New' row indicator. Clears for the household when someone approves the group, dismisses the badge, or one member has seen it twice (recordRecurrenceGroupNewBadgeImpressions). Always false on an ended group, so it never competes with that row's inactive treatment.
  """
  isNew: Boolean!

  """User-set logo; falls back to the merchant's logo when unset."""
  logoUrl: String

  """
  The group's merchant. May be null (leaves room for liability-backed groups, deferred).
  """
  merchant: Merchant

  """
  User-set custom name for the group; falls back to the merchant's name when unset.
  """
  name: String

  """
  Next expected charge (date + amount), projected from the cadence and the latest transaction.
  """
  nextForecastedTransaction: RecurringTransactionNextForecastedTransaction

  """
  Earliest expected occurrence the group has missed as of today; null when it has missed none. Today-relative and whole-group like `status`, so it is present on every view — unlike a row's `date`, which is scoped to its window and so cannot name a miss from an earlier month. Pair it with `status` (overdue / possibly_inactive) to date the Overdue badge.
  """
  overdueSince: Date

  """
  income / expense / transfer for the latest assigned transaction, derived from its category so it always agrees with `category` beside it (an uncategorized charge has no category type to read, so its amount sign decides). For a specific month's charge, read recurringType off recurrenceGroupsForPeriod instead.
  """
  recurringType: RecurringType

  """Raw 'as on statement' descriptor from the latest transaction."""
  statement: String

  """
  Derived current-cycle status (paid / upcoming / overdue / possibly_inactive / ended), from the latest transaction vs. the cadence. `possibly_inactive` is a nudge only — we never end a group automatically.
  """
  status: RecurrenceGroupStatus!

  """Assigned transactions, newest first."""
  transactions: [Transaction!]!
}

