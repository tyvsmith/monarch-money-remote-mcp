  """Value of exercised shares (full share price)"""
  exercisedValue: Float!

  """Shares forfeited (terminated/expired)"""
  forfeited: Float!

  """Value of forfeited shares (always 0)"""
  forfeitedValue: Float!

  """Shares that have been sold"""
  sold: Float!

  """Value of sold shares (always 0)"""
  soldValue: Float!

  """Total shares in grant"""
  total: Float!

  """Total value of all categories"""
  totalValue: Float!

  """Shares not yet vested"""
  unvested: Float!

  """Value of unvested shares (RSA with 83b only)"""
  unvestedValue: Float!

  """Shares vested but not exercised minus sold"""
  vested: Float!

  """Value of vested unexercised shares"""
  vestedValue: Float!
}

"""
One projected (not-yet-real) transaction derived from a recurring stream.

Virtual projections are computed on demand and never persisted, so ``id`` is synthetic — it
equals the stable natural key (``RTS_{stream_id}_{date}_{sequence}``) rather than a database PK.
"""
type VirtualTransaction {
  amount: Float!
  category: Category

  """Confidence tier: "high", "medium", or "low"."""
  confidence: String
  date: Date!
  description: String
  id: ID!
  isRecurring: Boolean!
  isVirtual: Boolean!
  merchant: Merchant
  naturalKey: String!

  """Stream classification: "merchant", "liability", or "paycheck"."""
  streamType: String
}

type WithdrawAllGoalContributionsFromAccount {
  account: Account
  errors: PayloadError
}

input WithdrawAllGoalContributionsFromAccountInput {
  accountId: ID!
  includeInBudget: Boolean = false
}

type ZestimateResult {
  addressCity: String!
  addressPostalCode: String!
  addressStateAbbr: String!
  addressStreet: String!
  zestimate: Int!
  zpid: String!
}