"""
A node in the system asset allocation taxonomy.

Backed by `SystemAllocationCategory` dataclasses from `monarch.constants.allocation`.
The 35-node tree lives in code (not the DB) — system categories are release-cycle
data, not row-mutable data. Per-household custom categories are deferred until they
have a product spec; when they land, this type may grow a separate union branch
or a `householdId` field.

The `id` field carries the slug — slugs are the stable identifier across deploys,
and there's no numeric PK to expose since the system tree isn't materialized.
"""
type AllocationCategory {
  children: [AllocationCategory!]!

  """The category's slug (used as the stable identifier)."""
  id: ID!

  """
  True for the global taxonomy; reserved for future household categories.
  """
  isSystem: Boolean!

  """
  Market-weight distribution across sub-categories using the representative index ticker. Empty for leaves and categories without a configured ticker (e.g. cash).
  """
  marketWeights: [AllocationCategoryWeight!]!
  name: String!
  parent: AllocationCategory

  """Contextual label used when this category is rendered under its parent."""
  shortName: String

  """Stable identifier — safe to key UI metadata on."""
  slug: String!
  sortOrder: Int!
}

"""
One (category, weight) tuple from a holding's allocation breakdown.

Weights are fractions of the holding's market value (0.0 to 1.0). For a fund
that spans multiple categories — VTI across the 9-cell US style box, VXUS
across Developed/Emerging international, BND across bond super-sectors — there
is one entry per leaf category. The list's weights sum to ~1.0 modulo rounding.
"""
type AllocationCategoryWeight {
  category: AllocationCategory!

  """Fraction of holding value (0.0 to 1.0)"""
  weight: Float!
}

