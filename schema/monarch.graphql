  The account's APY as a percentage between 0 and 100 (e.g. 4.25 for 4.25%). Depository accounts only; anything else is rejected. Unlike the other fields this is stored on the account itself (readable as Account.interestRate), not on the Monarch Method setting, so it is shared with the account editor. Omit to leave unchanged; pass null to clear it.
