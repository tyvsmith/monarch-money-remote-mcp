"""
The saved selection echoed by the set mutation: what counts, without recent spend.

The mutation only records the selection, so it returns the persisted category id set (no recent
spend or window). Read recent spend from the ``monarchMethodCashFlowFixedExpenseSettings`` query.
"""
type MonarchMethodCashFlowFixedExpenseSelection {
  """The expense categories now counted toward the Cash Flow pillar."""
  includedCategoryIds: [ID!]!
}

"""
Which of the household's expense categories count toward the Cash Flow pillar.

``categories`` is the full selectable universe (every expense category), each a full category
object flagged included/excluded with its recent spend, resolved against the live universe so a
stale stored id never appears. Until the household saves a selection (``isConfigured`` false) the
flags are the recommended default - fixed categories plus Taxes/Financial Fees - and the pillar
scores as unmeasurable; users can then include any expense category.
"""
type MonarchMethodCashFlowFixedExpenseSettings {
  """
  Every expense category, each with its inclusion state and recent spend.
  """
  categories: [MonarchMethodCashFlowFixedExpenseCategory!]!

  """
  Whether the household has saved a selection. When false, isIncluded reflects the recommended default rather than a saved answer, and the pillar is unmeasurable.
