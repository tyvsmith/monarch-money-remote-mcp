"""
Wipe every piece of saved Monarch Method state for the caller's own household.

Lets someone re-run the Monarch Method funnel from scratch, which is otherwise impossible: the
onboarding completion stamp is write-once and questionnaire answers are append-only. Clears the
questionnaire answers, the completion stamp, the score history, the per-account settings, and the
Cash Flow fixed-expense selection - all in one transaction.

Always scoped to ``info.context.user.household``: there is no household argument, so a caller can
only ever reset their own data. ``require_employee_or_demo`` is open to any authenticated user
outside production (so local development doesn't need the employee flag) and restricted to
employees and demo households in production, matching the other dev-tool reset mutations.

Deliberately not gated on the Monarch Method feature flag, so an employee can still clean up after
the flag is turned off.

Nothing outside Monarch Method is touched - accounts, transactions, and paychecks survive, so the
next score read recomputes from the same synced data with every self-reported input gone.
"""
type ResetMonarchMethod {
  """
  Row counts for what the reset deleted (all zero when nothing was saved).
  """
  resetSummary: MonarchMethodResetSummary
}

"""Mutation to reset (delete) a weekly recap for the given date range."""
type ResetRecapMutation {
  errors: PayloadError
  success: Boolean
}

"""Input for resetting a recap."""
input ResetRecapMutationInput {
  """End date of the recap period to reset"""
  endDate: Date!

  """Start date of the recap period to reset"""
  startDate: Date!
}

"""
Reset the caller's household's V2 detection state (employee-only).

By default, reset clears the detection cursor and deletes V2 groups and their transaction links,
so the next run cold-starts a full-window scan. With `deleteGroups: false`, reset clears only the
cursor and preserves existing groups so carryover continues during the full-window re-scan.

Deliberately not gated on `feat-recurring-v2`: clearing stale groups off a household that was
flagged back off is exactly what this exists for.
"""
type ResetRecurrenceGroupDetection {
  deletedGroupCount: Int!
  success: Boolean!
}

"""
Wipe saved Today onboarding state for the caller's own household.

Lets someone re-run the Today wizard from Get started, which is otherwise impossible: the
household completion stamp is write-once and questionnaire answers are append-only. Clears
the Today answers, the household stamp, and the caller's persona stamp — all in one
transaction.

Always scoped to ``info.context.user``: there is no household argument, so a caller can only
ever reset their own data. ``require_employee_or_demo`` is open to any authenticated user outside
production and restricted to employees and demo households in production.

Deliberately not gated on the Today feature flag, so an employee can still clean up after the
flag is turned off.
"""
type ResetTodayOnboarding {
  """Row counts for what the reset deleted (zero when nothing was saved)."""
  resetSummary: TodayOnboardingResetSummary
}

